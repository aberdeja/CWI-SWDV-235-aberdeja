<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>401 Unauthorized</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center p-4 p-md-5 bg-white shadow-sm rounded-3" style="max-width: 500px; width: 100%;">
      
      <!-- Status Code -->
      <h1 class="display-1 fw-bold text-danger mb-2">401</h1>
      
      <!-- Title & Message -->
      <h2 class="h4 fw-semibold text-dark mb-3">Unauthorized Access</h2>
      <p class="text-muted mb-4">
        You do not have permission to view this page. Please log in with an authorized account or contact your administrator.
      </p>
      
      <!-- Action Buttons -->
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="/login" class="btn btn-primary px-4">Log In</a>
        <a href="/" class="btn btn-outline-secondary px-4">Go Home</a>
      </div>

    </div>
  </div>

</body>
</html>
