<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm rounded-3 border-0">
      <div class="card-body p-4 p-sm-5">
        <h2 class="card-title text-center mb-4 fw-bold">Create Account</h2>
        
        <form>
          <!-- Full Name -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
          </div>

          <!-- Email Address -->
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Create a password" required autocomplete="new-password">
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required autocomplete="new-password">
          </div>

          <!-- Terms Checkbox -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="terms" required>
            <label class="form-check-label" for="terms">I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a></label>
          </div>

          <!-- Submit Button -->
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>

        <!-- Footer Link -->
        <p class="text-center mb-0 text-muted">
          Already have an account? <a href="/index.html" class="text-decoration-none">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
